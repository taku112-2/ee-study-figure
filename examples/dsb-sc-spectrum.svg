<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif">
  <title>抑制载波双边带频谱</title>
  <desc>DSB-SC 频谱。只有两条边频，fc 处没有谱线。</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <text x="36.0" y="40.0" fill="#0f172a" font-size="22" font-weight="700" text-anchor="start">抑制载波双边带</text>
  <text x="36.0" y="68.0" fill="#0b57d0" font-size="16" font-weight="400" text-anchor="start">s(t) = Ac cos(2π f_m t) cos(2π f_c t)</text>
  <line x1="80" y1="280.0" x2="80" y2="96" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="80" y1="280.0" x2="700" y2="280.0" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="64.0" y="104.0" fill="#0f172a" font-size="14" font-weight="400" text-anchor="end">幅度</text>
  <text x="712.0" y="286.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="start">f</text>
  <text x="370.0" y="308.0" fill="#64748b" font-size="16" font-weight="400" text-anchor="middle">f_c</text>
  <text x="370.0" y="262.0" fill="#c2410c" font-size="15" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">无载波</text>
  <line x1="220" y1="280.0" x2="220" y2="190.0" stroke="#0b57d0" stroke-width="2.4"/>
  <circle cx="220" cy="190.0" r="4" fill="#0b57d0"/>
  <text x="220.0" y="176.0" fill="#0b57d0" font-size="16" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">Ac/2</text>
  <text x="220.0" y="308.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">f_c−f_m</text>
  <line x1="520" y1="280.0" x2="520" y2="190.0" stroke="#0b57d0" stroke-width="2.4"/>
  <circle cx="520" cy="190.0" r="4" fill="#0b57d0"/>
  <text x="520.0" y="176.0" fill="#0b57d0" font-size="16" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">Ac/2</text>
  <text x="520.0" y="308.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">f_c+f_m</text>
</svg>
