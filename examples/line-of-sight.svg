<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif">
  <title>两天线视距</title>
  <desc>两座天线的视距。直角在地面切点。ht、hr 为天线高度，已夸大。</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="36.0" y="40.0" fill="#0f172a" font-size="22" font-weight="700" text-anchor="start">两天线视距</text>
  <text x="36.0" y="66.0" fill="#64748b" font-size="14" font-weight="400" text-anchor="start">直角在地面切点，不在天线处。高度已夸大。</text>
  <path d="M 590.9 295.0 A 210.0 210.0 0 0 0 232.7 358.2" fill="none" stroke="#0f172a" stroke-width="2.4"/>
  <line x1="430.0" y1="430.0" x2="430.0" y2="220.0" stroke="#0f172a" stroke-width="2"/>
  <line x1="270.0" y1="220.0" x2="510.0" y2="220.0" stroke="#0b57d0" stroke-width="2.4"/>
  <line x1="302.7" y1="263.0" x2="270.0" y2="220.0" stroke="#c2410c" stroke-width="3"/>
  <line x1="504.8" y1="233.8" x2="510.0" y2="220.0" stroke="#c2410c" stroke-width="3"/>
  <path d="M 416.0 220.0 L 416.0 234.0 L 430.0 234.0" fill="none" stroke="#0f172a" stroke-width="1.6"/>
  <circle cx="430.0" cy="430.0" r="4" fill="#0f172a"/>
  <circle cx="430.0" cy="220.0" r="4" fill="#0f172a"/>
  <circle cx="270.0" cy="220.0" r="4" fill="#c2410c"/>
  <circle cx="510.0" cy="220.0" r="4" fill="#c2410c"/>
  <text x="430.0" y="454.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">地心</text>
  <text x="440.0" y="266.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">切点</text>
  <text x="270.0" y="174.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">发射天线</text>
  <text x="510.0" y="174.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">接收天线</text>
  <text x="442.0" y="325.0" fill="#0f172a" font-size="16" font-weight="700" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">R</text>
  <text x="350.0" y="202.0" fill="#0b57d0" font-size="16" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">x₁</text>
  <text x="470.0" y="202.0" fill="#0b57d0" font-size="16" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">x₂</text>
  <text x="262.0" y="241.5" fill="#c2410c" font-size="15" font-weight="400" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">ht</text>
  <text x="520.0" y="226.9" fill="#c2410c" font-size="15" font-weight="400" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">hr</text>
  <text x="36.0" y="500.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="start">ht = 100 m，hr = 25 m 时，d = 4.12(√ht + √hr) = 61.8 km。</text>
  <text x="36.0" y="528.0" fill="#64748b" font-size="14" font-weight="400" text-anchor="start">4.12 用的是等效地球半径 4R/3。改用 R = 6371 km 会得到约 53.6 km。</text>
</svg>
