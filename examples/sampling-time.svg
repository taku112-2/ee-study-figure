<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif">
  <title>冲激抽样</title>
  <desc>冲激抽样的时域。相邻冲激间隔标为 Ts。</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <text x="36.0" y="40.0" fill="#0f172a" font-size="22" font-weight="700" text-anchor="start">冲激抽样</text>
  <line x1="70" y1="250.0" x2="70" y2="70" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="70" y1="250.0" x2="680" y2="250.0" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="52.0" y="78.0" fill="#0f172a" font-size="14" font-weight="400" text-anchor="end">x(t)</text>
  <text x="692.0" y="256.0" fill="#0f172a" font-size="15" font-weight="400" text-anchor="start">t</text>
  <line x1="120" y1="250.0" x2="120" y2="180.0" stroke="#0b57d0" stroke-width="2"/>
  <circle cx="120" cy="180.0" r="4" fill="#0b57d0"/>
  <line x1="230" y1="250.0" x2="230" y2="140.0" stroke="#0b57d0" stroke-width="2"/>
  <circle cx="230" cy="140.0" r="4" fill="#0b57d0"/>
  <line x1="340" y1="250.0" x2="340" y2="210.0" stroke="#0b57d0" stroke-width="2"/>
  <circle cx="340" cy="210.0" r="4" fill="#0b57d0"/>
  <line x1="450" y1="250.0" x2="450" y2="330.0" stroke="#0b57d0" stroke-width="2"/>
  <circle cx="450" cy="330.0" r="4" fill="#0b57d0"/>
  <line x1="560" y1="250.0" x2="560" y2="280.0" stroke="#0b57d0" stroke-width="2"/>
  <circle cx="560" cy="280.0" r="4" fill="#0b57d0"/>
  <line x1="120" y1="286.0" x2="230" y2="286.0" stroke="#0f172a" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="175.0" y="308.0" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">Ts</text>
  <text x="36.0" y="400.0" fill="#64748b" font-size="15" font-weight="400" text-anchor="start">相邻冲激的间隔是 Ts，不是 1/Ts。</text>
</svg>
