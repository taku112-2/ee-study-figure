<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif">
  <title>电离层反射的直角三角形模型</title>
  <desc>地心、发射点、电离层反射点构成直角三角形。切线 x = 1978 km，地面弧长 = 1918 km。h 已夸大。</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>
  <text x="36.0" y="42.0" fill="#0f172a" font-size="22" font-weight="700" text-anchor="start">电离层反射的直角三角形</text>
  <text x="36.0" y="70.0" fill="#64748b" font-size="14" font-weight="400" text-anchor="start">h 已夸大。直角在发射点：半径垂直于切线。</text>
  <path d="M 356.0 300.4 A 200.0 200.0 0 0 0 73.4 563.9" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="250.0" y1="470.0" x2="62.0" y2="270.0" stroke="#0f172a" stroke-width="2"/>
  <line x1="113.0" y1="324.3" x2="62.0" y2="270.0" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <line x1="250.0" y1="470.0" x2="250.0" y2="270.0" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="62.0" y1="270.0" x2="250.0" y2="270.0" stroke="#0b57d0" stroke-width="3"/>
  <text x="183.1" y="318.1" fill="#64748b" font-size="14" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">弧长</text>
  <path d="M 234.0 270.0 L 234.0 286.0 L 250.0 286.0" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="258.0" y="306.0" fill="#0f172a" font-size="13" font-weight="400" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">直角</text>
  <circle cx="250.0" cy="470.0" r="4.5" fill="#0f172a"/>
  <circle cx="250.0" cy="270.0" r="4.5" fill="#0f172a"/>
  <circle cx="62.0" cy="270.0" r="4.5" fill="#c2410c"/>
  <circle cx="113.0" cy="324.3" r="3.5" fill="#0f172a"/>
  <text x="250.0" y="498.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">地心</text>
  <text x="262.0" y="258.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">发射点</text>
  <text x="62.0" y="254.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">反射点</text>
  <text x="264.0" y="376.0" fill="#0f172a" font-size="18" font-weight="700" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">R</text>
  <text x="156.0" y="256.0" fill="#0b57d0" font-size="18" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">x</text>
  <text x="128.0" y="392.0" fill="#0f172a" font-size="18" font-weight="700" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">R+h</text>
  <text x="65.5" y="303.1" fill="#c2410c" font-size="18" font-weight="700" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">h</text>
  <path d="M 250.0 270.0 A 200.0 200.0 0 0 0 113.0 324.3" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="520" y="104" width="400" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="544.0" y="146.0" fill="#0f172a" font-size="20" font-weight="700" text-anchor="start">勾股关系</text>
  <text x="544.0" y="196.0" fill="#0f172a" font-size="18" font-weight="400" text-anchor="start">(R+h)² = R² + x²</text>
  <text x="544" y="234" font-size="18" fill="#0f172a">x² = 2Rh + <tspan fill="#c2410c">h²</tspan></text>
  <text x="544.0" y="278.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="start">h ≪ 2R 时可以略去 h²</text>
  <text x="544.0" y="312.0" fill="#0b57d0" font-size="18" font-weight="700" text-anchor="start">x ≈ √(2Rh)</text>
  <line x1="544" y1="340" x2="880" y2="340" stroke="#e2e8f0"/>
  <text x="544.0" y="376.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="start">R = 6371 km，h = 300 km</text>
  <text x="544.0" y="410.0" fill="#c2410c" font-size="16" font-weight="400" text-anchor="start">h² / 2Rh = 2.4%</text>
  <text x="544.0" y="444.0" fill="#0b57d0" font-size="16" font-weight="400" text-anchor="start">切线 x = 1978 km</text>
  <text x="544.0" y="478.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="start">略去 h² 后 x ≈ 1955 km</text>
  <text x="544.0" y="512.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="start">地面弧长 = 1918 km</text>
  <text x="544.0" y="550.0" fill="#64748b" font-size="13" font-weight="400" text-anchor="start">x 是切线。h ≪ R 时才把它当成单程地面距离。</text>
</svg>
