<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Microsoft YaHei, SimHei, Noto Sans CJK SC, sans-serif">
  <title>串联分压</title>
  <desc>两个电阻串联分压。Vo = Vin · R₂ / (R₁ + R₂)，Vo 是 R₂ 两端电压。</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="40.0" y="44.0" fill="#0f172a" font-size="22" font-weight="700" text-anchor="start">串联分压</text>
  <text x="168.0" y="44.0" fill="#0b57d0" font-size="18" font-weight="400" text-anchor="start">Vo = Vin · R₂ / (R₁ + R₂)</text>
  <line x1="120.0" y1="120.0" x2="250" y2="120.0" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="250" y="106.0" width="110" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="360" y1="120.0" x2="430.0" y2="120.0" stroke="#0f172a" stroke-width="1.8"/>
  <text x="305.0" y="96.0" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">R₁</text>
  <line x1="430.0" y1="120.0" x2="430.0" y2="176" stroke="#0f172a" stroke-width="1.8"/>
  <rect x="416.0" y="176" width="28" height="78" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="430.0" y1="254" x2="430.0" y2="300.0" stroke="#0f172a" stroke-width="1.8"/>
  <text x="458.0" y="224.0" fill="#0f172a" font-size="18" font-weight="700" text-anchor="start">R₂</text>
  <line x1="120.0" y1="120.0" x2="120.0" y2="168" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="120.0" cy="210" r="28" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
  <text x="120.0" y="204.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="middle">+</text>
  <text x="120.0" y="226.0" fill="#0f172a" font-size="16" font-weight="400" text-anchor="middle">−</text>
  <line x1="120.0" y1="238" x2="120.0" y2="300.0" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="120.0" y1="300.0" x2="430.0" y2="300.0" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="430.0" y1="300.0" x2="430.0" y2="318" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="412.0" y1="318" x2="448.0" y2="318" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="419.0" y1="326" x2="441.0" y2="326" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="425.0" y1="334" x2="435.0" y2="334" stroke="#0f172a" stroke-width="1.8"/>
  <circle cx="430.0" cy="120.0" r="3.5" fill="#0f172a"/>
  <text x="102.0" y="214.0" fill="#0f172a" font-size="16" font-weight="700" text-anchor="end" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">Vin</text>
  <text x="444.0" y="104.0" fill="#0b57d0" font-size="16" font-weight="700" text-anchor="start" stroke="#ffffff" stroke-width="5" paint-order="stroke fill" stroke-linejoin="round">Vo</text>
  <text x="40.0" y="390.0" fill="#64748b" font-size="15" font-weight="400" text-anchor="start">电流从 Vin 正极经 R₁、R₂ 回到负极。Vo 取在 R₂ 两端。</text>
</svg>
